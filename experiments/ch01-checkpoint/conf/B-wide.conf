# Прогон B: просторный бюджет WAL. Чекпойнты должны стать временными.
shared_buffers = 256MB
checkpoint_timeout = 15min
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
full_page_writes = on
wal_compression = off
log_checkpoints = on
log_min_duration_statement = -1
track_io_timing = on
