# Прогон A: тесный бюджет WAL. Чекпойнты запускаются по объёму.
shared_buffers = 256MB
checkpoint_timeout = 1min
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
full_page_writes = on
wal_compression = off
log_checkpoints = on
log_min_duration_statement = -1
track_io_timing = on
