# Прогон C: ДИАГНОСТИЧЕСКИЙ. Только на выбрасываемом инстансе.
# full_page_writes = off снимает защиту от torn pages.
# Существует ради одного числа: какая доля WAL является full-page images.
# Не переносить в production ни при каких условиях без доказанной
# атомарности записи страницы 8 kB в подсистеме хранения.
shared_buffers = 256MB
checkpoint_timeout = 1min
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
full_page_writes = off
wal_compression = off
log_checkpoints = on
log_min_duration_statement = -1
track_io_timing = on
